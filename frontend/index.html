<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <link rel="stylesheet" href="/web_assets/css/all.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body class="dark:bg-gray-900">
    <!-- Shown until the React root mounts, so a slow bundle or a stalled RPC
         never leaves the visitor on a plain white page. React replaces it. -->
    <div id="root">
      <div id="pre-boot">
        <img src="/web_assets/logo.png" alt="USDT Boss" />
        <div class="pre-boot-bar"><span></span></div>
      </div>
    </div>
    <style>
      #pre-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #050505;
      }
      #pre-boot img {
        width: 120px;
        height: auto;
        border-radius: 10px;
        filter: drop-shadow(0 0 12px rgba(255, 190, 40, 0.35));
      }
      .pre-boot-bar {
        width: 180px;
        height: 3px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 3px;
      }
      .pre-boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #ffd35a, #e0a52a);
        animation: pre-boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes pre-boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
